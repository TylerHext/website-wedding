<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP | M&T</title>
    <link rel="icon" href="../images/favicon-32x32.png">
    <link rel="stylesheet" href="../styles.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background-color: white;
            margin: 0;
            height: auto;
            min-height: 100vh;
            overflow-y: auto;
        }
        header h1 {
            color: rgb(0, 0, 0);
            font-size: 5vw;
            margin-top: 2.5vh;
            font-family: 'eaves';
        }
        .main-container {
            display: flex;
            justify-content: space-between;
            width: 100vw;
            height: 80vh;
            padding: 2vh 2vw;
            box-sizing: border-box;
        }
        .left-column, .right-column {
            flex: 1;
            padding: 2vh 2vw;
            box-sizing: border-box;
        }
        .left-column {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: nowrap;
            flex: 1;
        }
        .left-column img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            margin: 0 1vw;
        }
        .right-column {
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: rgb(0, 0, 0);
            font-size: 1.5vw;
            font-family: 'eaves';
            flex: 1;
        }
        .itinerary-dow-header {
            margin: 0.5em;
        }
        .day-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 2vh;
        }
        .day-text {
            flex: 1;
            padding: 1vh 1vw;
            box-sizing: border-box;
        }
        .day-text {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: rgb(0, 0, 0);
            font-size: 2vw;
            font-family: 'eaves';
        }
        .day-text a {
            color: black;
            text-decoration: underline;
        }
        .day-text a:hover {
            color: pink;
        }
        .narrow-header {
            display: none;
            object-fit: contain;
        }
        @media (max-width: 650px) {
            .main-container {
                flex-direction: column;
                height: auto;
            }
            .left-column {
                /* flex-direction: column;
                flex-wrap: nowrap; */
                display: none;
            }
            .left-column img {
                max-width: 45%;
                margin: 5px;
            }
            .right-column {
                font-size: 3vw;
                /* display: none; */
            }
            .right-column img {
                max-width: 75%;
            }
            .day-container {
                flex-direction: column;
                align-items: center;
            }
            .day-text {
                font-size: 3vw;
            } 
            .narrow-header {
                display: flex;
                width: 100vw;
                max-width: 100vw;
                justify-content: center;
                align-items: center;
                overflow: hidden;
                padding-left: 12vw;
                padding-right: 12vw;
                box-sizing: border-box;
            }
            .narrow-header img {
                width: 76vw;
                max-width: 76vw;
                height: auto;
                object-fit: cover;
                display: block;
            }
        }
    </style>
</head>
<body>
    <a href="../index.html" class="home-link">M&T</a>
    <nav>
        <a href="../index.html">Home</a>
        <a href="itinerary.html">Itinerary</a>
        <a href="travel.html">Travel</a>
        <a href="registry.html">Registry</a>
        <a href="rsvp.html">RSVP</a>
    </nav>
    <header>
        <h1>RSVP</h1>
    </header>
    <div class="main-container">
        <div class="left-column">
            <img src="../images/rsvp-1.jpg" alt="xmas">
            <img src="../images/rsvp-2.jpg" alt="xmas">
        </div>
        <div class="narrow-header">
            <img src="../images/melrose-knitting-mill-historic-image.jpg">
        </div>
        <div class="right-column">
            <div class="day-container">
                <div class="day-text">
                    <a class="itinerary-dow-header" href="https://www.zola.com/wedding/mathildeandtyler/rsvp">Click here to RSVP!</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
